<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>마카오 가족여행 · 구글 지도판</title>
  <meta name="description" content="마카오 가족여행 일정을 구글 지도 위에서 보는 시험판">
  <link rel="stylesheet" href="./style.css">
  <style>
    /* 구글 지도판에서만 쓰는 모양 */
    #g-note { position: absolute; left: 10px; right: 10px; top: 120px; z-index: 4; padding: 12px 14px; border-radius: 12px; background: #1d2a33; color: #fff; font-size: 14px; }
    #g-note[hidden] { display: none; }
    #g-note a { color: #9fd3ff; }
    .g-meta { margin: 0 0 8px; color: var(--muted, #5b6770); font-size: 14px; }
    .g-item { padding: 10px 0; border-top: 1px solid rgba(128, 128, 128, .25); }
    .g-item .t { font-weight: 700; }
    .g-item .day { display: inline-block; margin-right: 6px; padding: 1px 7px; border-radius: 9px; color: #fff; font-size: 12px; font-weight: 700; }
    .g-item .warn { color: #b45309; font-weight: 700; font-size: 13px; }
    .g-item ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
    .g-item p { margin: 6px 0 0; font-size: 14px; }
    .g-links { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
    .g-row { display: block; width: 100%; padding: 10px 0; border: 0; border-top: 1px solid rgba(128, 128, 128, .25); background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
    .g-row.quiet { opacity: .6; }
    .g-row .time { display: inline-block; min-width: 46px; font-weight: 700; }
    .g-day { margin: 14px 0 2px; font-size: 15px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="map" aria-label="구글 지도"></div>
    <div id="g-note" hidden></div>

    <header id="top">
      <h1 id="title">마카오 가족여행 · 구글 지도판</h1>
      <div id="tabs" role="tablist" aria-label="날짜"></div>
    </header>

    <nav id="bar" aria-label="메뉴">
      <button type="button" class="btn primary" id="btn-list">☰ <span>일정</span></button>
      <span class="gap"></span>
      <a class="btn" href="./index.html">3D 지도판으로</a>
    </nav>

    <section id="sheet" aria-label="여행 내용" hidden>
      <div id="sheet-head">
        <h2 id="sheet-title"></h2>
        <button type="button" class="btn icon" id="sheet-close" aria-label="닫기">✕</button>
      </div>
      <div id="sheet-body"></div>
    </section>
  </div>

  <noscript>이 페이지는 자바스크립트가 켜져 있어야 보입니다.</noscript>

  <script src="./data.js"></script>
  <script src="./gmap.js"></script>
</body>
</html>
