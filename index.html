<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>마카오 가족여행 2026.12.27–31</title>
  <meta name="description" content="마카오 4박 5일 가족여행 일정을 3D 지도에서 날짜별로 보는 투어맵">
  <!-- 지도 엔진(MapLibre GL JS 4.7.1)은 app.js 가 나중에 불러옵니다. 지도가 안 떠도 일정은 보입니다. -->
  <!-- 지도 서버에 미리 연결해 두어 첫 화면이 조금 빨리 뜬다 -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <link rel="stylesheet" href="./style.css">
  <!-- 홈 화면에 추가하면 앱처럼 열린다. 한 번 열어 두면 인터넷이 끊겨도 일정은 보인다 (sw.js) -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="마카오 여행">
  <meta name="theme-color" content="#18242c">
</head>
<body>
  <div id="app">
    <!-- 화면 전체가 3D 지도. 지도에서 장소를 누르면 아래에서 여행 내용이 올라옵니다. -->
    <div id="map" aria-label="3D 지도"></div>
    <div id="map-fallback" hidden>
      <p><strong>지도를 불러오지 못했습니다.</strong></p>
      <p>인터넷 연결을 확인해 주세요. 일정과 예약 버튼은 그대로 쓸 수 있습니다.</p>
    </div>

    <!-- 위쪽: 제목과 날짜 -->
    <header id="top">
      <div id="title-row">
        <h1 id="title">마카오 가족여행 2026.12.27–31</h1>
        <button type="button" id="btn-sos" aria-label="비상 연락처">🆘</button>
      </div>
      <div id="plan-toggle" role="group" aria-label="일정 안 선택" hidden></div>
      <div id="tabs" role="tablist" aria-label="날짜"></div>
      <!-- 여행 중에만 보인다: 오늘 다음 일정 (누르면 그 장소로) -->
      <button type="button" id="next" hidden></button>
    </header>

    <!-- 아래쪽: 투어 · 일정 목록 · 예약 · 비용 -->
    <nav id="bar" aria-label="메뉴">
      <button type="button" class="btn icon" id="tour-prev" aria-label="이전 장소">⏮</button>
      <button type="button" class="btn primary" id="tour-play">▶ 투어</button>
      <button type="button" class="btn icon" id="tour-next" aria-label="다음 장소">⏭</button>
      <span class="gap"></span>
      <button type="button" class="btn icon" id="btn-mode" aria-label="2D 평면 지도로 보기" aria-pressed="false">2D</button>
      <button type="button" class="btn" id="btn-list" aria-label="일정 목록">☰ <span>일정</span></button>
      <button type="button" class="btn icon" id="btn-booking" aria-label="예약 체크리스트">📋</button>
      <button type="button" class="btn icon" id="btn-eats" aria-label="맛집·카페">🍴</button>
      <button type="button" class="btn icon" id="btn-cost" aria-label="비용 요약">💰</button>
    </nav>
    <span id="tour-status" class="sr-only" aria-live="polite"></span>
    <!-- 내 위치(GPS): 누르면 지도에 파란 점으로 보이고 걸으면 따라온다 -->
    <button type="button" id="btn-locate" class="locate" aria-label="내 위치 보기" aria-pressed="false">📍</button>
    <!-- 시점 처음으로: 지금 고른 날짜의 장소가 다 보이게, 북쪽이 위로 -->
    <button type="button" id="btn-reset" class="locate reset" aria-label="지도 시점 처음으로">🧭</button>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <!-- 지금 마카오 날씨: 누르면 지도 날씨 효과를 끄고 켠다 -->
    <button type="button" id="wxnow" aria-pressed="true" aria-label="지금 마카오 날씨 (불러오는 중)"><span class="wx-i">🌡️</span><span class="wx-t">--°</span></button>

    <!-- 🚕 택시 카드: 기사에게 보여 주는 큰 한자 이름 (아무 곳이나 누르면 닫힘) -->
    <div id="taxi" role="dialog" aria-label="택시 기사에게 보여 주기" hidden>
      <p class="taxi-ask">請帶我去 · 이곳으로 가 주세요</p>
      <p id="taxi-zh"></p>
      <p id="taxi-area"></p>
      <p id="taxi-ko"></p>
      <p class="taxi-close">화면을 누르면 닫혀요</p>
    </div>

    <!-- 구글 지도 창: 지금 지도 위에 올라온다 (✕ 로 닫으면 보던 화면 그대로) -->
    <section id="gm" aria-label="구글 지도" hidden>
      <div id="gm-head">
        <h2 id="gm-title">구글 지도</h2>
        <a id="gm-open" class="btn small" href="#" target="_blank" rel="noopener noreferrer">앱으로 열기</a>
        <button type="button" class="btn icon" id="gm-close" aria-label="구글 지도 닫기">✕</button>
      </div>
      <iframe id="gm-frame" title="구글 지도" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
    </section>

    <!-- 아래에서 올라오는 창: 누른 장소의 여행 내용, 또는 그날 일정 목록 -->
    <section id="sheet" aria-label="여행 내용" hidden>
      <div id="sheet-head">
        <button type="button" class="btn" id="sheet-back" aria-label="일정 목록으로 돌아가기" hidden>‹ 일정</button>
        <h2 id="sheet-title"></h2>
        <button type="button" class="btn icon" id="sheet-close" aria-label="닫기">✕</button>
      </div>
      <div id="sheet-body">
        <div id="place"></div>
        <div id="list">
          <div id="cards"></div>
          <div id="foot">
            <p>가격·운행 시각·영업시간은 바뀔 수 있습니다. 현장·공식 사이트에서 최종 확인하세요.</p>
            <p>지도의 선은 장소를 직선으로 이은 대략적인 동선입니다. 건물 모양은 공개 지도 자료로 그린 것이라 실제와 다를 수 있습니다.</p>
            <p id="foot-rhythm"></p>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- 예약 체크리스트 / 비용 요약 창 -->
  <div id="modal" hidden>
    <div id="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div id="modal-head">
        <h2 id="modal-title"></h2>
        <button type="button" class="btn icon" id="modal-close" aria-label="닫기">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <noscript>이 페이지는 자바스크립트가 켜져 있어야 보입니다.</noscript>

  <!-- 일정 데이터(여기만 고치면 됩니다) → 기능 순서로 불러옵니다. -->
  <script src="./data.js"></script>
  <script src="./ko-names.js"></script>
  <script src="./app.js"></script>
</body>
</html>
